name: Hourly weather snapshot

# Fetches REAL Open-Meteo rainfall + soil moisture for every village and
# stores it in the Neon database, because the hosted backend's shared
# outbound IP is rate-limited by Open-Meteo. See scripts/fetch_weather_snapshot.py.
on:
  schedule:
    - cron: "17 * * * *"   # hourly at :17 (GitHub may start it a few minutes late)
  workflow_dispatch: {}     # "Run workflow" button for manual runs

concurrency:
  group: weather-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Fetch and store snapshot
        env:
          GIRIVARSHA_DATABASE_URL: ${{ secrets.GIRIVARSHA_DATABASE_URL }}
        run: python scripts/fetch_weather_snapshot.py
