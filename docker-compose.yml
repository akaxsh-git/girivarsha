# Phase 1 note: this compose file describes the target local-dev topology
# (problem-statement item 28). It has NOT been run in this sandbox — no
# Docker daemon is available here (verified: `docker info` fails to reach
# /var/run/docker.sock). Backend and frontend were verified directly instead
# (venv + uvicorn, npm run build + vite preview). Please run
# `docker compose up --build` on your own machine as the first real test of
# this file, and report back anything that needs fixing.
services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-girivarsha}
      POSTGRES_USER: ${POSTGRES_USER:-girivarsha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-girivarsha}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GIRIVARSHA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-girivarsha}:${POSTGRES_PASSWORD:-change-me-locally}@postgres:5432/${POSTGRES_DB:-girivarsha}
      GIRIVARSHA_ENVIRONMENT: development
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"

volumes:
  pgdata:
